name: Build GameLogger v2.2 vents final

on:
  workflow_dispatch:
  push:
    branches:
      - gamelogger-v2.2-vents-final
    paths:
      - "tools/GameLogger-v2.2/**"
      - ".github/workflows/build-gamelogger-v2.2.yml"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Fetch GameLogger 2024.3.5 source
        run: |
          git clone https://github.com/whichtwix/GameLogger.git upstream-gamelogger
          cd upstream-gamelogger
          git checkout 7add7254002659d2c2215d79184dd0efad53eb54

      - name: Apply Crew'mong Us v2.2 vent patch
        run: python tools/GameLogger-v2.2/patch_v2_2.py

      - name: Restore
        run: |
          cd upstream-gamelogger
          dotnet restore GameLogger.sln --configfile nuget.config

      - name: Build
        run: |
          cd upstream-gamelogger
          dotnet build GameLogger.sln -c Release --no-restore

      - name: Upload GameLogger v2.2 DLL
        uses: actions/upload-artifact@v4
        with:
          name: GameLogger-v2.2-vents-final
          path: upstream-gamelogger/GameLogger/bin/Release/net6.0/GameLogger.dll
          if-no-files-found: error
